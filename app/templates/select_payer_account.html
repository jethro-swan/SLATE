{% extends "base.html" %}

{% block content %}

<h3>Select the account from which to pay</h3>

<p>
  Paying to identity <b>{{ payee_identity_hrns }}</b>
  in currency <b>{{ payment_currency_hrns }}</b>
</p>

<ul>
{% for payer_account in payer_account_options %}
<li>
  <a href="/pay/select/payee/{{ payer_account.fph }}">
    <b>{{ payer_account.hrns }}</b>
  </a>
</li>
{% endfor %}
</ul>

{% endblock %}
