{% extends "base.html" %}

{% block content %}

<h3>Select the account to which to pay</h3>

<p>
  Paying to identity <b>{{ payee_identity_hrns }}</b>
  in currency <b>{{ payment_currency_hrns }}</b>
</p>

<ul>
{% for payee_account in payee_account_options %}
<li>
  <a href="/pay/agent/payment/{{ payer_account_fph }}/{{ payee_account.fph }}">
    <b>{{ payee_account.hrns }}</b>
  </a>
</li>
{% endfor %}
</ul>

{% endblock %}
